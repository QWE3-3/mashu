name: Deploy Site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p site
          unzip -q assets.zip -d site
          if [ ! -f site/index.html ]; then
            inner=$(find site -maxdepth 2 -name index.html -printf '%h\n' | head -1)
            if [ -n "$inner" ]; then
              mv "$inner"/* site/
              rm -rf "$inner"
            fi
          fi
          ls site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
